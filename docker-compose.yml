services:
  db:
    image: postgres:16-alpine
    container_name: online-retail-db
    environment:
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_pass
      POSTGRES_DB: retail_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_user -d retail_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    image: online-retail-api:latest
    container_name: online-retail-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://retail_user:retail_pass@db:5432/retail_db
    restart: unless-stopped

volumes:
  pgdata:
